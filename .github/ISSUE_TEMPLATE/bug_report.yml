# [AIGC] T-040 · RR-T040-20261113-0001 · 待人工审查（P-10） · SPDX-License-Identifier: GPL-3.0-only
# 本仓库采用 GPL-3.0-only；表单只收脱敏事实，绝不索取真实身体数据（FR-053 / P-14）。
name: 缺陷报告 / Bug report
description: 报告可复现的缺陷；请先用完全虚构的最小夹具复现，勿粘贴任何真实个人数据。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交缺陷报告。请先阅读 `CONTRIBUTING.md` 与 `SUPPORT.md`。
        本项目不构成医疗或营养建议；请勿在报告中粘贴真实身体数据、个人档案、
        本地计划 / 台账 / 日志原文，或受版权保护的指南原文（P-06 / P-14 / FR-032）。
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 当前源码版本（如 0.1.0-dev）或可定位的提交号。
      placeholder: 0.1.0-dev
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响组件
      options:
        - src/core（核心域）
        - src/cli（命令行）
        - src/mcp（MCP Server）
        - src/io（端口与适配器）
        - locales / data（语言包与元数据）
        - tests / gates（测试与门禁）
        - docs / community（文档）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤（脱敏）
      description: 用完全虚构的最小夹具给出 1 / 2 / 3 步；不得出现任何真实个人数值。
      placeholder: |
        1. 运行 `npm test`
        2. 使用虚构 fixture ...
        3. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 引用 SPEC.md 的 FR / AC 编号说明「怎样算完成」。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 只贴稳定错误码、断言输出或纯 ASCII 报告行（FR-049）。
    validations:
      required: true
  - type: input
    id: ac_ref
    attributes:
      label: 关联 AC-xx / FR-xxx（若已知）
      placeholder: AC-12 / FR-038
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 本报告不包含真实身体数据、个人可识别数据或真实档案原文。
          required: true
        - label: 本报告的 [AIGC] 内容已经人工审查（P-10）。
          required: true
